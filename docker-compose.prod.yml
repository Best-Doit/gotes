services:
  web:
    build: .
    entrypoint: ["/app/docker-entrypoint.prod.sh"]
    command: ["gunicorn", "config.wsgi:application"]
    env_file:
      - ${GOTES_ENV_FILE:-.env}
    environment:
      DJANGO_DEBUG: "0"
      POSTGRES_HOST: postgres-global
      POSTGRES_PORT: "5432"
      GOTES_DATA_DIR: /app/.data
      GOTES_MEDIA_ROOT: /app/.data/media
      RUN_MIGRATIONS: "1"
      COLLECT_STATIC: "1"
    ports:
      - "8009:8000"
    volumes:
      - gotes_media:/app/.data/media
    networks:
      - nr-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/login/', headers={'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s

  email_worker:
    build: .
    entrypoint: ["/app/docker-entrypoint.prod.sh"]
    command: ["python", "manage.py", "send_notification_emails", "--watch", "--interval", "30"]
    env_file:
      - ${GOTES_ENV_FILE:-.env}
    environment:
      DJANGO_DEBUG: "0"
      POSTGRES_HOST: postgres-global
      POSTGRES_PORT: "5432"
      GOTES_DATA_DIR: /app/.data
      GOTES_MEDIA_ROOT: /app/.data/media
      RUN_MIGRATIONS: "0"
      COLLECT_STATIC: "0"
    depends_on:
      web:
        condition: service_healthy
    networks:
      - nr-net
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  gotes_media:

networks:
  nr-net:
    external: true